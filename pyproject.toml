[project]
name = "sqlforge"
version = "0.1.0"
description = "Text-to-SQL with a small LLM: SFT + GRPO on Spider, evaluated by execution accuracy, served via FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=2.3.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlglot>=30.25.0",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlforge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "training", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
