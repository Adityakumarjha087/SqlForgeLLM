[project]
name = "sqlforge"
version = "0.1.0"
description = "Text-to-SQL with a small LLM: SFT + GRPO on Spider, evaluated by execution accuracy, served via FastAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "huggingface-hub>=2.3.0",
    "matplotlib>=3.11.2",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "sqlglot>=30.25.0",
    "tqdm>=4.70.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "ruff>=0.8",
]
ml = [
    "accelerate>=1.15.0",
    "peft>=0.21.2",
    "torch>=2.14.1",
    "transformers>=5.21.0",
]
train = [
    "bitsandbytes>=0.45 ; sys_platform == 'linux'",
    "datasets>=3.0",
    "trl>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlforge"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "training", "scripts"]
# Colab notebooks are thin shell-magic wrappers; lint rules target the package.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
